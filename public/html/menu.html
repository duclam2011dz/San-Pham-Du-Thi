<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Menu - Chạy Trốn Khỏi Khu Tự Trị</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative h-screen w-screen text-white font-sans overflow-hidden">

    <!-- Background -->
    <div class="absolute inset-0 bg-cover bg-center brightness-75"
        style="background-image: url('../assets/img/background.png');"></div>

    <!-- Overlay mờ -->
    <div class="absolute inset-0 bg-black bg-opacity-40"></div>

    <!-- Nội dung Menu -->
    <div id="menuContainer"
        class="relative z-10 h-full flex flex-col justify-center items-center opacity-0 transition-opacity duration-700">

        <h1 class="text-4xl font-extrabold mb-10 text-green-400 drop-shadow-lg">
            🏃‍♂️ Chạy Trốn Khỏi Khu Tự Trị
        </h1>

        <div class="flex flex-col gap-4 w-56 mx-auto">
            <button id="playBtn" class="bg-green-600 hover:bg-green-500 py-2 rounded text-lg font-semibold">Play
                ▶️</button>
            <button id="settingsBtn" class="bg-blue-600 hover:bg-blue-500 py-2 rounded text-lg font-semibold">Settings
                ⚙️</button>
            <button id="editorBtn" class="bg-yellow-500 hover:bg-yellow-400 py-2 rounded text-lg font-semibold">Create
                Custom Level 🧱</button>
            <button id="quitBtn" class="bg-red-600 hover:bg-red-500 py-2 rounded text-lg font-semibold">Quit ❌</button>
        </div>
    </div>

    <!-- Fade transition overlay -->
    <div id="fadeOverlay" class="fixed inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-700">
    </div>

    <script type="module" src="../src/menu.js"></script>
</body>

</html>
